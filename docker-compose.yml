version: '3.9'

services:
  # MongoDB Database
  mongo:
    image: mongo:7.0
    container_name: event-ticketing-mongo
    environment:
      MONGO_INITDB_ROOT_USERNAME: admin
      MONGO_INITDB_ROOT_PASSWORD: password
      MONGO_INITDB_DATABASE: event-ticketing
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    networks:
      - event-ticketing
    healthcheck:
      test: echo 'db.runCommand("ping").ok' | mongosh localhost:27017/test --quiet
      interval: 10s
      timeout: 5s
      retries: 5

  # Redis Cache & Locks
  redis:
    image: redis:7-alpine
    container_name: event-ticketing-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - event-ticketing
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Backend API Server
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: event-ticketing-backend
    environment:
      NODE_ENV: development
      PORT: 5000
      MONGO_URI: mongodb://admin:password@mongo:27017/event-ticketing?authSource=admin
      REDIS_URL: redis://redis:6379
      JWT_SECRET: dev_jwt_secret_change_in_production
      JWT_REFRESH_SECRET: dev_refresh_secret_change_in_production
      PAYMENT_SECRET: dev_payment_secret
      PAYMENT_WEBHOOK_SECRET: dev_webhook_secret
      CLIENT_URL: http://localhost
      LOG_LEVEL: debug
    ports:
      - "5000:5000"
    depends_on:
      mongo:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./backend/src:/app/src
    networks:
      - event-ticketing
    command: npm run dev

  # Frontend React App
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: event-ticketing-frontend
    ports:
      - "80:80"
    depends_on:
      - backend
    networks:
      - event-ticketing

  # Nginx Reverse Proxy (already integrated in frontend, but keeping for clarity)
  # Could be a separate service if needed for more complex routing

networks:
  event-ticketing:
    driver: bridge

volumes:
  mongo_data:
  redis_data:
